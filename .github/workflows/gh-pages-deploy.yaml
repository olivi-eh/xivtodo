name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gh-pages-deploy.yaml
      - frontend/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish, but skip any queued between it and the latest one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install packages
        run: npm ci

      - name: Build
        env:
          VITE_BUILD_NUM: ${{ github.run_number }}.${{ github.sha }}
          VITE_BACKEND_API_URI: https://api.xivtodo.com
          VITE_DISCORD_CLIENT_ID: "933567168912719923"
          VITE_DISCORD_REDIRECT_URI: https://xivtodo.com/auth
        run: VITE_BUILD_DATE="$(date)" npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
